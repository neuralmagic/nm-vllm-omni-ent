# Phase 5 (partial): Generate release notes for omni-* tags.
#
# Runs alongside omni-release.yml on tag push. Collects commits since the
# previous omni-* tag and writes a draft GitHub Release with the changelog.
#
# Does not publish wheels/images — that is handled by omni-pipeline PUBLISH (nm-cicd).

name: omni release notes
run-name: Release notes ${{ github.ref_name }} — ${{ github.actor }}

on:
  push:
    tags:
      - "omni-*"

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PREV_TAG=$(git tag -l 'omni-*' --sort=-version:refname | sed -n '2p' || true)

          {
            echo "## ${TAG}"
            echo ""
            if [[ -n "${PREV_TAG}" ]]; then
              echo "Changes since \`${PREV_TAG}\`:"
              echo ""
              git log --pretty=format:'- %s (%h)' "${PREV_TAG}..${TAG}"
            else
              echo "Initial release."
              echo ""
              git log --pretty=format:'- %s (%h)' -n 50 "${TAG}"
            fi
            echo ""
            echo ""
            echo "---"
            echo ""
            echo "Full pipeline: [nm-cicd omni-pipeline](https://github.com/neuralmagic/nm-cicd/actions/workflows/omni-pipeline.yml)"
          } > release-notes.md

          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            echo "Updated release notes for ${TAG}"
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --notes-file release-notes.md
            echo "Created draft release for ${TAG}"
          fi

      - name: Write step summary
        shell: bash
        run: |
          {
            echo "### Release notes for \`${{ github.ref_name }}\`"
            echo ""
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
