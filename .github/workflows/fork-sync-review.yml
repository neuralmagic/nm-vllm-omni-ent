name: Fork Sync Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to analyze (must target this repo)'
        required: true
        type: number
      new_upstream:
        description: 'Upstream tag (e.g. v0.26.0). Omit to extract from branch name (sync-<tag>).'
        required: false
        type: string

jobs:
  sync-review:
    # Auto-trigger only for sync-* branches; workflow_dispatch always runs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'sync-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup remotes
        run: |
          # Ensure all origin branches are available as remote-tracking refs
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --quiet

          # Add upstream and fetch tags + main (needed for merge-base detection)
          git remote add upstream-omni https://github.com/vllm-project/vllm-omni.git
          git fetch upstream-omni --tags --quiet
          git fetch upstream-omni main --quiet

      - name: Determine parameters
        id: params
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_NUMBER="${{ inputs.pr_number }}"
            PR_JSON=$(gh pr view "$PR_NUMBER" --json headRefName,baseRefName)
            NEW_FORK=$(echo "$PR_JSON" | jq -r .headRefName)
            OLD_FORK=$(echo "$PR_JSON" | jq -r .baseRefName)
            NEW_UPSTREAM="${{ inputs.new_upstream }}"
            if [[ -z "$NEW_UPSTREAM" ]]; then
              NEW_UPSTREAM="${NEW_FORK#sync-}"
            fi
          else
            NEW_FORK="${{ github.head_ref }}"
            OLD_FORK="${{ github.base_ref }}"
            NEW_UPSTREAM="${NEW_FORK#sync-}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          echo "new_fork=${NEW_FORK}" >> "$GITHUB_OUTPUT"
          echo "old_fork=${OLD_FORK}" >> "$GITHUB_OUTPUT"
          echo "new_upstream=${NEW_UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          echo "::notice::Sync review: ${OLD_FORK} → ${NEW_FORK} (upstream ${NEW_UPSTREAM})"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run diff-fork-sync
        run: |
          ./midstream/diff-fork-sync.sh \
            --new-upstream "${{ steps.params.outputs.new_upstream }}" \
            --old-fork "${{ steps.params.outputs.old_fork }}" \
            --new-fork "${{ steps.params.outputs.new_fork }}" \
            --output-dir sync-review \
            --force \
            --verbose

      - name: Post PR comment
        if: steps.params.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('sync-review/summary.md', 'utf8');
            const prNumber = parseInt('${{ steps.params.outputs.pr_number }}');

            const marker = '<!-- fork-sync-review -->';
            const body = [
              marker,
              '## :mag: Fork Sync Review',
              '',
              summary,
              '',
              '---',
              `*Generated by [\`diff-fork-sync.sh\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${context.sha}/midstream/diff-fork-sync.sh) — patches available as [workflow artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`,
            ].join('\n');

            // Update existing comment or create new one (no spam on re-push)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
              core.info(`Updated existing comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
              core.info('Created new comment');
            }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-review
          path: |
            sync-review/summary.md
            sync-review/all.patch
            sync-review/delta.patch
          if-no-files-found: ignore
          retention-days: 30
