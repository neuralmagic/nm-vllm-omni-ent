# Triggers the omni-pipeline workflow in nm-cicd for:
#   - tags matching omni-*
#   - pull requests (full pipeline + commit status on PR head)
#   - manual workflow_dispatch
#
# On tag push, defaults are fixed:
#   - cicd_ref=feature/vllm-omni-tp  (switch to main after nm-cicd omni PR merges)
#   - wf_category=RELEASE
#   - run_ocp_validation=true
#   - python=3.12
#
# On pull request, defaults:
#   - cicd_ref=feature/vllm-omni-tp
#   - wf_category=DEBUG
#   - run_ocp_validation=true
#   - report_commit_status=true on PR head SHA
#
# This workflow dispatches once and exits — the full build+test cycle runs in
# nm-cicd as a single workflow run (no cross-repo polling).

name: omni release
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Omni PR #{0} — {1}', github.event.pull_request.number, github.actor) || format('Omni {0} — {1}', github.event_name == 'push' && github.ref_name || inputs.ref || github.ref_name, github.actor) }}

on:
  push:
    tags:
      - "omni-*"

  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (default: current ref)"
        type: string
        required: false
      cicd_ref:
        description: "Branch or ref of nm-cicd"
        type: string
        default: "feature/vllm-omni-tp"
      python:
        description: "Python version"
        type: string
        default: "3.12"
      vllm_run_id:
        description: "Override vLLM wheel run ID (auto-resolved from midstream/vllm-wheels.yml when empty)"
        type: string
        required: false
        default: ""
      wf_category:
        description: "Workflow category"
        type: choice
        options:
          - DEBUG
          - NIGHTLY
          - RELEASE
        default: DEBUG
      run_ocp_validation:
        description: "Run OCP model validation after accept-sync"
        type: boolean
        default: true
      model_validation_configs_ref:
        description: "git ref for model-validation-configs"
        type: string
        default: "main"
      testing_options_flags:
        description: "Options for get_testing_options.py (e.g. --tags-include tiny)"
        type: string
        required: false
        default: ""
      report_commit_status:
        description: "Post nm-cicd/omni-pipeline commit status (use for PR branch validation)"
        type: boolean
        default: false

concurrency:
  group: omni-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || (github.event_name == 'push' && github.ref_name || inputs.ref || github.ref_name) }}
  CICD_REF: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'feature/vllm-omni-tp' || inputs.cicd_ref }}
  PYTHON: ${{ inputs.python || '3.12' }}
  VLLM_RUN_ID: ${{ inputs.vllm_run_id || '' }}
  WF_CATEGORY: ${{ github.event_name == 'push' && 'RELEASE' || (github.event_name == 'pull_request' && 'DEBUG' || inputs.wf_category || 'DEBUG') }}
  RUN_OCP: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'true' || inputs.run_ocp_validation }}
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  REPORT_STATUS: ${{ (github.event_name == 'pull_request' || inputs.report_commit_status) && 'true' || 'false' }}
  MODEL_VAL_REF: ${{ inputs.model_validation_configs_ref || 'main' }}
  TESTING_OPTIONS: ${{ inputs.testing_options_flags || '' }}

jobs:
  trigger-omni-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CICD_APP_ID }}
          private-key: ${{ secrets.CICD_APP_PRIVATE_KEY }}
          owner: neuralmagic

      - name: Trigger nm-cicd omni-pipeline workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          ARGS=(
            workflow run omni-pipeline.yml
            --repo neuralmagic/nm-cicd
            --ref "$CICD_REF"
            -f "repo=${{ github.repository }}"
            -f "ref=$REF"
            -f "python=$PYTHON"
            -f "target_device=cuda"
            -f "wf_category=$WF_CATEGORY"
            -f "run_ocp_validation=$RUN_OCP"
            -f "model_validation_configs_ref=$MODEL_VAL_REF"
            -f "testing_options_flags=$TESTING_OPTIONS"
            -f "source_run_id=${{ github.run_id }}"
            -f "source_repo=${{ github.repository }}"
            -f "source_sha=$SOURCE_SHA"
            -f "report_commit_status=$REPORT_STATUS"
          )

          if [[ -n "$VLLM_RUN_ID" ]]; then
            ARGS+=(-f "vllm_run_id=$VLLM_RUN_ID")
          fi

          gh "${ARGS[@]}"

          PIPELINE_URL="https://github.com/neuralmagic/nm-cicd/actions/workflows/omni-pipeline.yml"

          {
            echo "### Triggered nm-cicd omni pipeline"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| Workflow | \`neuralmagic/nm-cicd / omni-pipeline.yml\` |"
            echo "| Pipeline runs | [View in nm-cicd](${PIPELINE_URL}) |"
            echo "| nm-cicd ref | \`$CICD_REF\` |"
            echo "| Omni repo | \`${{ github.repository }}\` |"
            echo "| Omni ref | \`$REF\` |"
            echo "| Source SHA | \`$SOURCE_SHA\` |"
            echo "| python | \`$PYTHON\` |"
            echo "| wf_category | \`$WF_CATEGORY\` |"
            echo "| run_ocp_validation | \`$RUN_OCP\` |"
            echo "| report_commit_status | \`$REPORT_STATUS\` |"
            echo "| vllm_run_id | \`${VLLM_RUN_ID:-auto from midstream/vllm-wheels.yml}\` |"
            echo "| model_validation_configs_ref | \`$MODEL_VAL_REF\` |"
            echo "| testing_options_flags | \`$TESTING_OPTIONS\` |"
            echo ""
            echo "The full build cycle (wheel → image → accept-sync partitions → OCP validation) runs in a **single nm-cicd workflow run**."
          } >> "$GITHUB_STEP_SUMMARY"
